name: release

# desktop installers for all three platforms, cut on a version tag:
#   linux   -> .deb / .rpm / .appimage
#   windows -> .msi / .exe (nsis)
#   macos   -> .dmg (universal binary, intel + apple silicon in one)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install linux system deps (webkit2gtk and friends)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend deps
        run: pnpm install --frozen-lockfile

      - name: typecheck and unit tests before bundling
        run: |
          pnpm exec tsc --noEmit
          pnpm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Answer Sheet Evaluator ${{ github.ref_name }}'
          releaseBody: 'installers for linux (deb / rpm / appimage), windows (msi / nsis) and macos (dmg, universal binary)'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
